name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Node 22 LTS: better-sqlite3's prebuilt native binary is stable here.
        # Newer Node (24/26) has a native-addon regression that segfaults the
        # better-sqlite3 binding under Vitest workers.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        # Ensure the better-sqlite3 binary matches the runner's exact Node ABI.
        run: npm rebuild better-sqlite3

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
